<script id="prepaint">
/* Before the stylesheet paints anything: apply saved theme, text size and
   language, so a dark phone never flashes white. Mirrors prefs.applyToDocument. */
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('pphys.prefs.v1') || '{}') || {}; } catch (e) {}
  var r = document.documentElement;
  var theme = ['light', 'dark'].indexOf(p.theme) >= 0 ? p.theme : 'auto';
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = theme === 'auto' ? (dark ? 'dark' : 'light') : theme;
  var s = [1, 1.15, 1.3, 1.5].indexOf(p.scale) >= 0 ? p.scale : 1;
  r.style.setProperty('--font-scale', s);
  if (s >= 1.3) r.dataset.single = '';
  if (p.chosen && ['zh', 'en', 'ms'].indexOf(p.lang) >= 0) r.lang = p.lang === 'zh' ? 'zh-Hans' : p.lang;
})();
</script>
